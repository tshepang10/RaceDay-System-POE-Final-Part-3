# Whole RaceDay system in one command:
#   docker compose up --build
# Website  http://localhost:8081   (MVC, Part 3)
# API      http://localhost:8080   (Swagger at /swagger, Part 2)
# Azurite  http://localhost:10000  (Azure Blob Storage emulator)
# SQL      localhost,1433          (sa / $SA_PASSWORD)
#
# To use a real Azure Storage account instead of Azurite, set AZURE_STORAGE_CONNECTION_STRING
# in a .env file (never commit it) and leave AZURE_STORAGE_PUBLIC_BASE_URL empty.

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64   # SQL Server has no ARM image; runs under emulation on Apple Silicon Macs
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:-RaceDay_Dev_2026!}"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 12

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./database:/scripts:ro
    entrypoint: ["/bin/bash", "-c", "/opt/mssql-tools18/bin/sqlcmd -C -S db -U sa -P \"$${SA_PASSWORD}\" -i /scripts/RaceDayDB.sql"]
    environment:
      SA_PASSWORD: "${SA_PASSWORD:-RaceDay_Dev_2026!}"
    restart: "no"

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--blobPort", "10000", "--loose", "--skipApiVersionCheck"]
    ports:
      - "10000:10000"

  api:
    build:
      context: .
      dockerfile: RaceDay.Api/Dockerfile
    depends_on:
      db-init:
        condition: service_completed_successfully
      azurite:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Default: "Server=db;Database=RaceDayDB;User Id=sa;Password=${SA_PASSWORD:-RaceDay_Dev_2026!};TrustServerCertificate=True;MultipleActiveResultSets=True"
      Jwt__Key: "${JWT_KEY:-docker-demo-signing-key-change-me-0123456789}"
      Storage__Provider: "AzureBlob"
      # Azurite's published development account (a public, well-known key — not a secret).
      Storage__ConnectionString: "${AZURE_STORAGE_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;}"
      # The API reaches Azurite as "azurite", but browsers load images from localhost.
      Storage__PublicBaseUrl: "${AZURE_STORAGE_PUBLIC_BASE_URL-http://localhost:10000/devstoreaccount1}"
      Cors__AllowedOrigins__0: "http://localhost:8081"

  web:
    build:
      context: .
      dockerfile: RaceDay.Web/Dockerfile
    depends_on:
      - api
    ports:
      - "8081:8080"
    environment:
      Api__BaseUrl: "http://api:8080/"
